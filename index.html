<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 0.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    main {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem 3rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    main h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    main p {
      line-height: 1.8;
      font-size: 1rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>
    <h1>LLL</h1>
    <p>Bienvenido a mi proyecto</p>
  </header>

  <main>
    <h2>Acerca de este proyecto</h2>
    <p>
      Esta es la página principal del proyecto LLL.
      Aquí podrás encontrar información relevante sobre el contenido
      y los objetivos de este repositorio.
    </p>
  </main>

  <footer>
    <p>&copy; 2026 LLL. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
